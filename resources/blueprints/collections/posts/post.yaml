tabs:
  main:
    display: Main
    sections:
      -
        display: Head
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: featured_image
            field:
              container: assets
              max_files: 1
              type: assets
              display: 'Featured Image'
              instructions: 'gambar utama.'
              validate:
                - image
          -
            handle: excerpt
            field:
              type: textarea
              display: Excerpt
              instructions: 'ringkasan konten.'
      -
        display: Content
        fields:
          -
            handle: description
            field:
              buttons:
                - h2
                - h3
                - h4
                - h5
                - h6
                - bold
                - italic
                - underline
                - strikethrough
                - small
                - unorderedlist
                - orderedlist
                - removeformat
                - quote
                - anchor
                - image
                - table
                - superscript
                - subscript
                - horizontalrule
              container: assets
              remove_empty_nodes: false
              type: bard
              display: Description
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: categories
            field:
              type: terms
              taxonomies:
                - categories
              display: Categories
              mode: select
          -
            handle: tags
            field:
              type: terms
              taxonomies:
                - tags
              display: Tags
              mode: select
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
title: Post
